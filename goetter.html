<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Götter & Kulte – Chroniken</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="chroniken-admin.css">
  <style>
    .wrap { max-width: 1100px; margin: auto; padding: 2rem 1.5rem; }
    .god-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.2rem; }
    .god-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1.3rem; transition: border-color 0.2s, box-shadow 0.2s, background 0.2s; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .god-card:hover { border-color: var(--accent-soft); background: var(--bg-hover); box-shadow: 0 0 20px rgba(168, 85, 247, 0.22); }
    .god-card h3 { margin: 0 0 0.3rem; color: var(--accent-soft); font-size: 1.25rem; }
    .god-card .domain { font-size: 0.85rem; color: var(--accent); margin-bottom: 0.6rem; font-weight: 600; }
    .god-card .full-text { font-size: 0.95rem; color: var(--text-muted); line-height: 1.6; }
  </style>
</head>
<body>
  <div class="bg-overlay"></div>
  <header>
    <div class="logo-wrap"><div class="logo">Chroniken</div></div>
    <nav>
      <a href="index.html">Start</a>
      <a href="news.html">News</a>
      <a href="events.html">Events</a>
      <a href="kalender.html">Kalender</a>
      <a href="wiki.html">Wiki</a>
      <a href="bibliothek.html">Bibliothek</a>
      <a href="voelker.html">Völker</a>
      <a href="berufe.html">Berufe</a>
      <a href="kreaturen.html">Kreaturen</a>
      <a href="regeln.html">Regeln</a>
      <a href="goetter.html" class="active">Götter</a>
      <a href="charakterbogen.html">Charakterbogen</a>
    </nav>
  </header>

  <main class="wrap">
    <h1 class="page-title">Götter & Kulte</h1>
    <p class="page-desc">Die Mächte und Götter der Welt. Neue Einträge erscheinen automatisch im Charakterbogen.</p>

    <section class="admin-panel" id="adminPanel" style="display:none;">
      <div class="admin-form">
        <h2 id="formTitle" data-testid="goetter-form-title">Neuen Gott anlegen</h2>
        <div class="admin-grid">
          <div class="admin-field"><label>Name *</label><input id="fName" data-testid="goetter-input-name" placeholder="z. B. Aurelion"></div>
          <div class="admin-field"><label>Domäne</label><input id="fDomain" data-testid="goetter-input-domain" placeholder="Licht • Ordnung • Sonne"></div>
          <div class="admin-field full"><label>Kurztext</label><textarea id="fShort" data-testid="goetter-input-short"></textarea></div>
          <div class="admin-field full"><label>Ausführlicher Text</label><textarea id="fFull" data-testid="goetter-input-full"></textarea></div>
        </div>
        <div class="admin-actions">
          <button class="btn" id="btnSave" data-testid="goetter-save-btn">Speichern</button>
          <button class="btn secondary" id="btnCancel" data-testid="goetter-cancel-btn" style="display:none;">Abbrechen</button>
          <span class="admin-status" id="status"></span>
        </div>
      </div>
      <h2 class="admin-sub-title">Vorhandene Götter</h2>
    </section>

    <div class="god-grid" id="tiles"></div>
  </main>

  <footer><p>© Kiyasha</p></footer>

  <script src="chroniken-data.js"></script>
  <script>
    const KEY = "goetter";
    const esc = ChronikenData.esc;
    let editIndex = null;
    const el = id => document.getElementById(id);
    function admin() { return ChronikenData.isAdmin(); }

    function render() {
      const list = ChronikenData.load(KEY);
      el("adminPanel").style.display = admin() ? "block" : "none";
      el("tiles").innerHTML = list.map((g, i) => `
        <div class="god-card">
          <h3>${esc(g.name)}</h3>
          <div class="domain">${esc(g.domain || "")}</div>
          <p class="full-text">${esc(g.full || g.short || "")}</p>
          ${admin() ? `<div class="tile-actions">
            <button class="btn secondary" data-edit="${i}" data-testid="goetter-edit-${i}">Bearbeiten</button>
            <button class="btn danger" data-del="${i}" data-testid="goetter-delete-${i}">Löschen</button>
          </div>` : ""}
        </div>`).join("");
      el("tiles").querySelectorAll("[data-edit]").forEach(b => b.onclick = () => startEdit(+b.dataset.edit));
      el("tiles").querySelectorAll("[data-del]").forEach(b => b.onclick = () => remove(+b.dataset.del));
    }

    function resetForm() {
      editIndex = null;
      el("fName").value = ""; el("fDomain").value = ""; el("fShort").value = ""; el("fFull").value = "";
      el("formTitle").textContent = "Neuen Gott anlegen";
      el("btnSave").textContent = "Speichern";
      el("btnCancel").style.display = "none";
      el("status").textContent = "";
    }

    function startEdit(i) {
      const g = ChronikenData.load(KEY)[i];
      if (!g) return;
      editIndex = i;
      el("fName").value = g.name || ""; el("fDomain").value = g.domain || ""; el("fShort").value = g.short || ""; el("fFull").value = g.full || "";
      el("formTitle").textContent = "Gott bearbeiten";
      el("btnSave").textContent = "Änderungen speichern";
      el("btnCancel").style.display = "inline-block";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function remove(i) {
      if (!confirm("Diesen Gott wirklich löschen?")) return;
      const list = ChronikenData.load(KEY);
      list.splice(i, 1);
      ChronikenData.save(KEY, list);
      if (editIndex === i) resetForm();
      render();
    }

    function save() {
      const name = el("fName").value.trim();
      if (!name) { el("status").style.color = "#f87171"; el("status").textContent = "Bitte einen Namen eingeben."; return; }
      const list = ChronikenData.load(KEY);
      const short = el("fShort").value.trim();
      const entry = { name, domain: el("fDomain").value.trim(), short, full: el("fFull").value.trim() || short };
      if (editIndex !== null && list[editIndex]) list[editIndex] = entry; else list.push(entry);
      ChronikenData.save(KEY, list);
      resetForm();
      el("status").style.color = "#22c55e";
      el("status").textContent = "✓ Gespeichert";
      render();
      setTimeout(() => { el("status").textContent = ""; }, 2500);
    }

    el("btnSave").onclick = save;
    el("btnCancel").onclick = resetForm;
    render();
    window.addEventListener("storage", render);
  </script>
</body>
</html>
