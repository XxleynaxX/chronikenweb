name: Generate portal PNGs

on:
  push:
    branches: [main]
    paths:
      - "assets/portal/*.svg"
      - "scripts/generate_portal_png.py"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rasterizer
        run: |
          python -m pip install --upgrade pip
          python -m pip install cairosvg pillow

      - name: Generate PNG portal cards
        run: python scripts/generate_portal_png.py

      - name: Commit generated PNGs
        run: |
          if git diff --quiet -- assets/portal/*-full.png; then
            echo "No PNG changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portal/*-full.png
          git commit -m "Generate portal PNG cards"
          git push
