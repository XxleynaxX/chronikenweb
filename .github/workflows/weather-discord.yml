name: Wetter Discord Meldung

# Automatisch alle 15 Min; manuell jederzeit (FORCE_NOTIFY).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Sofort senden (auch ohne Slot-Wechsel)"
        type: boolean
        default: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wetter an Discord senden
        env:
          DISCORD_WEATHER_WEBHOOK: ${{ secrets.DISCORD_WEATHER_WEBHOOK }}
          FORCE_NOTIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
        run: node .github/scripts/weather-notify.js
