
# Chroniken Wetter → Discord
# Läuft unabhängig von der Website. Ändert KEINE HTML/JS-Dateien.
# goetter.html und alle anderen Seiten bleiben unberührt.

name: Wetter Discord Meldung

on:
  schedule:
    # Alle 6 Stunden (UTC) – passt zu den Slot-Grenzen
    # 00:05, 06:05, 12:05, 18:05 UTC
    - cron: '5 0,6,12,18 * * *'
  workflow_dispatch:   # manuell starten möglich

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wetter an Discord senden
        env:
          DISCORD_WEATHER_WEBHOOK: ${{ secrets.DISCORD_WEATHER_WEBHOOK }}
        run: node .github/scripts/weather-notify.js
