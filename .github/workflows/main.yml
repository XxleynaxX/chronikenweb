name: Discord Notification

on:
  push:
    branches:
      - main

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        uses: rjstone/discord-webhook-notify@v1.0.4
        with:
          severity: info
          text: "🚀 Ein neues Update wurde im Projekt gepusht!"
          details: "Autor: ${{ github.actor }} | Commit: ${{ github.event.head_commit.message }}"
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}
