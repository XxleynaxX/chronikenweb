name: Mod Check
on:
  schedule:
    # Alle 3 Stunden (UTC)
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore state
        id: cache
        uses: actions/cache@v4
        with:
          path: state.json
          key: mod-state-v1

      - name: Ensure state file
        run: |
          if [ ! -f state.json ]; then echo '{}' > state.json; fi

      - name: Check mods
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ONCE: "1"
          QUIET: "1"
        run: node index.js

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: mod-state-v1
