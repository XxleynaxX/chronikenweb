<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chroniken · Team</title><link rel="stylesheet" href="admin.css"></head><body><div class="shell"><aside class="sidebar"><div class="brand">Die Chroniken <small>Admin</small></div><nav><a href="index.html">🏠 Dashboard</a><a href="aufgaben.html">📋 Aufgaben</a><a href="projekte.html">📁 Projekte</a><a class="active" href="team.html">👥 Team</a><a href="aktivitaeten.html">📜 Aktivitäten</a></nav></aside><main class="main"><header class="top"><div><h1>Discord-Team</h1><p>Mitglieder aus deinem Discord-Server.</p></div></header><section id="locked" class="panel locked" hidden><h2>🔒 Nur für Admins</h2><a class="btn" id="login">Mit Discord anmelden</a></section><div id="app" hidden><section class="panel"><div id="current"></div><div id="list" class="team-list"></div><p class="muted">Die Teamdaten kommen direkt über die Team-API deines Discord-Bots. Status, Rollen und Avatar werden automatisch übernommen.</p></section></div></main></div><script src="admin.js"></script><script>
(async()=>{
  if(!await guard())return;
  try{
    const d=await api('/admin/team');
    document.getElementById('current').innerHTML=
      '<p>Angemeldet: <strong>'+esc(d.current.name)+'</strong> · Discord-ID '+esc(d.current.id)+'</p>';

    const members=d.members||[];
    document.getElementById('list').innerHTML=members.map(m=>{
      const status=m.status||'offline';
      const statusLabel=status==='online'?'Online':status==='idle'?'Abwesend':status==='dnd'?'Nicht stören':'Offline';
      const avatar=m.avatar
        ? '<img class="team-avatar" src="'+esc(m.avatar)+'" alt="" loading="lazy">'
        : '<div class="team-avatar team-avatar-empty">👤</div>';
      const roles=(m.roles||[]).map(r=>'<span class="team-role">'+esc(r)+'</span>').join('');
      return '<div class="member team-member">'+
        avatar+
        '<div class="team-member-main">'+
          '<strong>'+esc(m.displayName||m.name||'Discord')+'</strong>'+
          '<div class="muted">'+esc(m.id)+'</div>'+
          '<div class="team-status team-status-'+esc(status)+'"><span>●</span> '+statusLabel+'</div>'+
          (roles?'<div class="team-roles">'+roles+'</div>':'')+
        '</div>'+
      '</div>';
    }).join('')||'<div class="muted">Keine Mitglieder geladen.</div>';

    document.querySelector('.muted:last-child')?.remove();
  }catch(e){
    document.getElementById('list').innerHTML='<div class="muted">'+esc(e.message)+'</div>';
  }
})()
</script></body></html>
