<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chroniken · Team</title><link rel="stylesheet" href="admin.css"></head><body><div class="shell"><aside class="sidebar"><div class="brand">Die Chroniken <small>Admin</small></div><nav><a href="index.html">🏠 Dashboard</a><a href="aufgaben.html">📋 Aufgaben</a><a href="projekte.html">📁 Projekte</a><a class="active" href="team.html">👥 Team</a><a href="aktivitaeten.html">📜 Aktivitäten</a></nav></aside><main class="main"><header class="top"><div><h1>Discord-Team</h1><p>Mitglieder aus deinem Discord-Server.</p></div></header><section id="locked" class="panel locked" hidden><h2>🔒 Nur für Admins</h2><a class="btn" id="login">Mit Discord anmelden</a></section><div id="app" hidden><section class="panel"><div id="current"></div><div id="list" class="team-list"></div><p class="muted">Die Namen kommen über die Discord-Bot-API. Für die vollständige Liste muss DISCORD_BOT_TOKEN auf Render gesetzt sein.</p></section></div></main></div><script src="admin.js"></script><script>(async()=>{if(!await guard())return;try{const d=await api('/admin/team');document.getElementById('current').innerHTML='<p>Angemeldet: <strong>'+esc(d.current.name)+'</strong> · Discord-ID '+esc(d.current.id)+'</p>';document.getElementById('list').innerHTML=(d.members||[]).map(m=>'<div class="member">👤 '+esc(m.name)+'<div class="muted">'+esc(m.id)+'</div></div>').join('')||'<div class="muted">Keine Mitglieder geladen.</div>'}catch(e){document.getElementById('list').innerHTML='<div class="muted">'+esc(e.message)+'</div>'}})()</script></body></html>
