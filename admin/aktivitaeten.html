<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chroniken · Aktivitäten</title><link rel="stylesheet" href="admin.css"></head><body><div class="shell"><aside class="sidebar"><div class="brand">Die Chroniken <small>Admin</small></div><nav><a href="index.html">🏠 Dashboard</a><a href="aufgaben.html">📋 Aufgaben</a><a href="projekte.html">📁 Projekte</a><a href="charaktere.html">🛡️ Charakterverwaltung</a><a class="active" href="aktivitaeten.html">📜 Aktivitäten</a></nav></aside><main class="main"><header class="top"><div><h1>Aktivitäten</h1><p>Wer hat was im Admin-System geändert?</p></div></header><section id="locked" class="panel locked" hidden><h2>🔒 Nur für Admins</h2><a class="btn" id="login">Mit Discord anmelden</a></section><div id="app" hidden><section class="panel"><div id="list"></div></section></div></main></div><script src="admin.js"></script><script>(async()=>{if(!await guard())return;const d=await api('/admin/activity?limit=200');document.getElementById('list').innerHTML=(d.activities||[]).map(a=>'<div class="activity"><strong>'+esc(a.action)+'</strong><div class="muted">Discord: '+esc(a.discord_id)+' · '+fmtDate(a.created_at)+'</div><div>'+esc(a.details||'')+'</div></div>').join('')||'<div class="muted">Keine Aktivitäten.</div>'})()</script></body></html>
