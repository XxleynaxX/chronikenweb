<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chroniken · Aufgaben</title><link rel="stylesheet" href="admin.css"></head><body><div class="shell"><aside class="sidebar"><div class="brand">Die Chroniken <small>Admin</small></div><nav><a href="index.html">🏠 Dashboard</a><a class="active" href="aufgaben.html">📋 Aufgaben</a><a href="projekte.html">📁 Projekte</a><a href="charaktere.html">🛡️ Charakterverwaltung</a><a href="aktivitaeten.html">📜 Aktivitäten</a><a href="../index.html">↩ Zur Webseite</a></nav></aside><main class="main"><header class="top"><div><h1>Aufgaben</h1><p>Offen, in Arbeit, blockiert oder fertig.</p></div><button class="btn" id="new">＋ Aufgabe</button></header><section id="locked" class="panel locked" hidden><h2>🔒 Nur für Admins</h2><p>Bitte mit Discord anmelden.</p><a class="btn" id="login">Mit Discord anmelden</a></section><div id="app" hidden><section class="panel"><div class="filters"><button class="btn small" data-filter="">Alle</button><button class="btn small" data-filter="open">Offen</button><button class="btn small" data-filter="working">In Arbeit</button><button class="btn small" data-filter="blocked">Blockiert</button><button class="btn small" data-filter="done">Fertig</button></div><div id="list"></div></section></div></main></div><div id="modal" class="modal" hidden><div class="modal-box"><h2 id="modalTitle">Aufgabe</h2><form id="form"><input type="hidden" id="id"><label>Titel<input id="title" required></label><label>Beschreibung<textarea id="description"></textarea></label><label>Projekt<select id="project"></select></label><label>Discord-ID Verantwortlich<input id="assigned" placeholder="optional"></label><div class="two"><label>Status<select id="status"><option value="open">Offen</option><option value="working">In Arbeit</option><option value="waiting">Wartet</option><option value="blocked">Blockiert</option><option value="done">Fertig</option></selec
