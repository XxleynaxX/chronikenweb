<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chroniken – Wetter</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="chroniken-admin.css">

  <script src="chroniken-data.js"></script>
  <script src="wetter.js"></script>

  <style>
    .weather-wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    .weather-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2rem;
      text-align: center;
    }

    .weather-icon {
      font-size: 5rem;
    }

    .weather-name {
      font-size: 2rem;
      color: var(--accent-soft);
      margin: .5rem 0;
    }

    .weather-desc {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .timer {
      margin-top: 1.4rem;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(168, 85, 247, .06);
    }

    .history {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: .8rem;
      margin-top: 1.2rem;
    }

    .history div.wcard {
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, .02);
    }

    .small {
      color: var(--text-muted);
      font-size: .85rem;
    }
  </style>
</head>

<body>

  <div class="bg-overlay"></div>

  <header>
    <div class="logo-wrap">
      <div class="logo">Chroniken</div>
    </div>

    <nav>
      <a href="index.html">Start</a>
      <a href="news.html">News</a>
      <a href="events.html">Events</a>
      <a href="kalender.html">Kalender</a>
      <a href="wetter.html" class="active">Wetter</a>
      <a href="wiki.html">Wiki</a>
      <a href="bibliothek.html">Bibliothek</a>
      <a href="voelker.html">Völker</a>
      <a href="berufe.html">Berufe</a>
      <a href="kreaturen.html">Kreaturen</a>
      <a href="regeln.html">Regeln</a>
      <a href="goetter.html">Götter</a>
      <a href="charakterbogen.html">Charakterbogen</a>
    </nav>
  </header>

  <main class="weather-wrap">

    <section class="hero">
      <h1>🌦️ Wetter</h1>

      <p class="subtitle">
        Das Wetter der Chroniken wechselt alle sechs Stunden.
      </p>
    </section>

    <div class="weather-card">

      <div class="weather-icon" id="icon">
        🌤️
      </div>

      <h2 class="weather-name" id="name">
        Wetter
      </h2>

      <p class="weather-desc" id="desc"></p>

      <div class="timer">

        <strong>
          Nächster Wetterwechsel
        </strong>

        <div
          id="countdown"
          style="font-size:1.6rem;margin-top:.4rem"
        >
          00:00:00
        </div>

      </div>

    </div>

    <section style="margin-top:2rem">

      <h2>
        🌙 Mögliche Wetterlagen
      </h2>

      <div
        class="history"
        id="tiles"
      ></div>

    </section>

  </main>

  <footer>
    <p>© Kiyasha</p>
  </footer>

  <script>

    const el = id =>
      document.getElementById(id);


    /*
     * ==========================================================
     * AKTUELLES WETTER
     * ==========================================================
     *
     * Die Wetterauswahl kommt ausschließlich aus wetter.js.
     */

    function draw(weather) {

      if (!weather) {
        weather =
          ChronikenWeather.get();
      }

      el("icon").textContent =
        weather.icon || "🌦️";

      el("name").textContent =
        weather.name || "Unbekannt";

      el("desc").textContent =
        weather.description || "";

      el("countdown").textContent =
        ChronikenWeather.format(
          ChronikenWeather.msNext()
        );
    }


    /*
     * ==========================================================
     * WETTERWECHSEL
     * ==========================================================
     *
     * wetter.js meldet hier einen neuen 6-Stunden-Slot.
     */

    window.addEventListener(
      "chroniken-weather-changed",
      function (event) {

        draw(event.detail);

      }
    );


    /*
     * ==========================================================
     * WETTERLISTE
     * ==========================================================
     *
     * Die Liste kommt ebenfalls aus wetter.js.
     * Es gibt keine zweite Wetterquelle mehr.
     */

    function renderWeatherList() {

      const list =
        ChronikenWeather.getWeatherList();

      el("tiles").innerHTML =
        list.map(function (weather) {

          return `
            <div class="wcard">

              <strong>
                ${escapeHtml(weather.icon)}
                ${escapeHtml(weather.name)}
              </strong>

              <p class="small">
                ${escapeHtml(weather.description)}
              </p>

            </div>
          `;

        }).join("");
    }


    /*
     * HTML-Sonderzeichen absichern.
     */
    function escapeHtml(value) {

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /*
     * ==========================================================
     * START
     * ==========================================================
     */

    draw();

    renderWeatherList();


    /*
     * Countdown aktualisieren.
     *
     * Die Wetterauswahl selbst wird NICHT
     * hier vorgenommen.
     */

    setInterval(
      function () {

        el("countdown").textContent =
          ChronikenWeather.format(
            ChronikenWeather.msNext()
          );

      },
      1000
    );

  </script>

</body>
</html>
