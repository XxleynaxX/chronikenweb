<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berufe & Handwerk – Chroniken</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="chroniken-admin.css">
  <style>
    .wrap { max-width: 1100px; margin: auto; padding: 2rem 1.5rem; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.2rem; }
    .tile { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1.3rem; transition: border-color 0.2s, box-shadow 0.2s, background 0.2s; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .tile:hover { border-color: var(--accent-soft); background: var(--bg-hover); box-shadow: 0 0 20px rgba(168, 85, 247, 0.22); }
    .tile h3 { margin: 0 0 0.4rem; color: var(--accent-soft); font-size: 1.2rem; }
    .cat-badge { display: inline-block; font-size: 0.78rem; padding: 0.2rem 0.55rem; border-radius: 999px; background: rgba(168, 85, 247, 0.15); color: var(--accent-soft); border: 1px solid rgba(168, 85, 247, 0.3); margin-bottom: 0.6rem; }
    .muted { color: var(--text-muted); font-size: 0.92rem; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="bg-overlay"></div>
  <header>
    <div class="logo-wrap"><div class="logo">Chroniken</div></div>
    <nav>
      <a href="index.html">Start</a>
      <a href="news.html">News</a>
      <a href="events.html">Events</a>
      <a href="kalender.html">Kalender</a>
      <a href="wetter.html">Wetter</a>
      <a href="wiki.html">Wiki</a>
      <a href="bibliothek.html">Bibliothek</a>
      <a href="voelker.html">Völker</a>
      <a href="berufe.html" class="active">Berufe</a>
      <a href="kreaturen.html">Kreaturen</a>
      <a href="regeln.html">Regeln</a>
      <a href="goetter.html">Götter</a>
      <a href="charakterbogen.html">Charakterbogen</a>
    </nav>
  </header>

  <main class="wrap">
    <h1 class="page-title">Berufe & Handwerk</h1>
    <p class="page-desc">Übersicht aller Handwerke und Tätigkeiten. Neue Einträge erscheinen automatisch im Charakterbogen.</p>

    <section class="admin-panel" id="adminPanel" style="display:none;">
      <div class="admin-form">
        <h2 id="formTitle" data-testid="berufe-form-title">Neuen Beruf anlegen</h2>
        <div class="admin-grid">
          <div class="admin-field"><label>Name *</label><input id="fName" data-testid="berufe-input-name" placeholder="z. B. Alchemist"></div>
          <div class="admin-field"><label>Kategorie</label>
            <select id="fCategory" data-testid="berufe-input-category">
              <option value="Hauptberuf">Hauptberuf</option>
              <option value="Nebenberuf">Nebenberuf</option>
            </select>
          </div>
          <div class="admin-field full"><label>Beschreibung</label><textarea id="fDesc" data-testid="berufe-input-desc"></textarea></div>
        </div>
        <div class="admin-actions">
          <button class="btn" id="btnSave" data-testid="berufe-save-btn">Speichern</button>
          <button class="btn secondary" id="btnCancel" data-testid="berufe-cancel-btn" style="display:none;">Abbrechen</button>
          <span class="admin-status" id="status"></span>
        </div>
      </div>
      <h2 class="admin-sub-title">Vorhandene Berufe</h2>
    </section>

    <div class="tiles" id="tiles"></div>
  </main>

  <footer><p>© Kiyasha</p></footer>

  <script src="chroniken-data.js"></script>
  <script>
    const KEY = "berufe";
    const esc = ChronikenData.esc;
    let editIndex = null;
    const el = id => document.getElementById(id);
    function admin() { return ChronikenData.isAdmin(); }

    function render() {
      const list = ChronikenData.load(KEY);
      el("adminPanel").style.display = admin() ? "block" : "none";
      el("tiles").innerHTML = list.map((j, i) => `
        <article class="tile">
          <span class="cat-badge">${esc(j.category || "Beruf")}</span>
          <h3>${esc(j.name)}</h3>
          <p class="muted">${esc(j.description || "Keine Beschreibung")}</p>
          ${admin() ? `<div class="tile-actions">
            <button class="btn secondary" data-edit="${i}" data-testid="berufe-edit-${i}">Bearbeiten</button>
            <button class="btn danger" data-del="${i}" data-testid="berufe-delete-${i}">Löschen</button>
          </div>` : ""}
        </article>`).join("");
      el("tiles").querySelectorAll("[data-edit]").forEach(b => b.onclick = () => startEdit(+b.dataset.edit));
      el("tiles").querySelectorAll("[data-del]").forEach(b => b.onclick = () => remove(+b.dataset.del));
    }

    function resetForm() {
      editIndex = null;
      el("fName").value = ""; el("fCategory").value = "Hauptberuf"; el("fDesc").value = "";
      el("formTitle").textContent = "Neuen Beruf anlegen";
      el("btnSave").textContent = "Speichern";
      el("btnCancel").style.display = "none";
      el("status").textContent = "";
    }

    function startEdit(i) {
      const j = ChronikenData.load(KEY)[i];
      if (!j) return;
      editIndex = i;
      el("fName").value = j.name || ""; el("fCategory").value = j.category || "Hauptberuf"; el("fDesc").value = j.description || "";
      el("formTitle").textContent = "Beruf bearbeiten";
      el("btnSave").textContent = "Änderungen speichern";
      el("btnCancel").style.display = "inline-block";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function remove(i) {
      if (!confirm("Diesen Beruf wirklich löschen?")) return;
      const list = ChronikenData.load(KEY);
      list.splice(i, 1);
      ChronikenData.save(KEY, list);
      if (editIndex === i) resetForm();
      render();
    }

    function save() {
      const name = el("fName").value.trim();
      if (!name) { el("status").style.color = "#f87171"; el("status").textContent = "Bitte einen Namen eingeben."; return; }
      const list = ChronikenData.load(KEY);
      const entry = { name, category: el("fCategory").value, description: el("fDesc").value.trim() };
      if (editIndex !== null && list[editIndex]) list[editIndex] = entry; else list.push(entry);
      ChronikenData.save(KEY, list);
      resetForm();
      el("status").style.color = "#22c55e";
      el("status").textContent = "✓ Gespeichert";
      render();
      setTimeout(() => { el("status").textContent = ""; }, 2500);
    }

    el("btnSave").onclick = save;
    el("btnCancel").onclick = resetForm;
    render();
    window.addEventListener("storage", render);
  </script>
</body>
</html>
